server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: no CORS, no hard-coded backend address in the bundle.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    # The embeddable chat (<script src=".../widget.js">). Browsers re-check it
    # on every page load, so a deploy reaches every site that embeds it at once.
    location = /widget.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
