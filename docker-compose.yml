services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - "8081:8000"
    volumes:
      # The vector index and pipeline data live on the host, so nightly
      # updates reach the running API without rebuilding the image.
      - ./data:/app/data
      # Hugging Face model cache (bge-m3 is ~2.3 GB): downloaded once.
      - hf-models:/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf-models:
