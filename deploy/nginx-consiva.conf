# Host nginx: routes the two domains to the Docker containers.
#
#   rag.consiva.tech    -> chat widget (frontend container, port 8082)
#   apirag.consiva.tech -> API         (backend container,  port 8081)
#
# Install on the server:
#   sudo cp deploy/nginx-consiva.conf /etc/nginx/sites-available/consiva
#   sudo ln -s /etc/nginx/sites-available/consiva /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rag.consiva.tech -d apirag.consiva.tech   # HTTPS

server {
    listen 80;
    server_name rag.consiva.tech;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name apirag.consiva.tech;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers can take a while when the LLM is slow.
        proxy_read_timeout 90s;
    }
}
